<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tracker" />
  <link rel="apple-touch-icon" href="icon.png" />
  <title>Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #4a7c59;
      --green-dark: #3a6347;
      --green-light: #e8f2ec;
      --bg: #f0f2f0;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --radius: 16px;
      --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.06);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    header {
      background: var(--green);
      color: white;
      padding: 20px 20px 24px;
      padding-top: max(20px, env(safe-area-inset-top, 20px));
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.85rem;
      opacity: 0.75;
      margin-top: 2px;
    }

    main {
      padding: 20px 16px 40px;
      max-width: 600px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 24px 0 10px;
    }

    .section-label:first-child { margin-top: 0; }

    .event-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .card-icon {
      font-size: 1.8rem;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--green-light);
      border-radius: 12px;
      flex-shrink: 0;
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .card-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta .since {
      font-weight: 600;
      color: var(--green);
    }

    .log-btn {
      background: var(--green);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .log-btn:hover  { background: var(--green-dark); }
    .log-btn:active { transform: scale(0.95); }

    .log-btn.just-logged {
      background: var(--green-light);
      color: var(--green);
    }

    .history-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }

    .history-item:last-child { border-bottom: none; }

    .history-icon { font-size: 1rem; width: 20px; text-align: center; }
    .history-name { font-weight: 500; flex: 1; }
    .history-time { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }

    .history-delete {
      background: none;
      border: none;
      color: #d1d5db;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px 6px;
      border-radius: 6px;
      line-height: 1;
      margin-left: 4px;
    }
    .history-delete:hover { color: #ef4444; background: #fef2f2; }

    .empty-history {
      padding: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .footer-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.78rem;
      padding: 4px 0;
    }
    .clear-btn:hover { color: #ef4444; }
  </style>
</head>
<body>

<header>
  <h1>📋 Tracker</h1>
  <p>Druk op een knop om het tijdstip te registreren</p>
</header>

<main>
  <p class="section-label">Events</p>
  <div class="event-list" id="event-grid"></div>

  <p class="section-label">Geschiedenis</p>
  <div class="history-card" id="history-list"></div>
  <div class="footer-row">
    <button class="clear-btn" onclick="clearHistory()">Geschiedenis wissen</button>
  </div>
</main>

<script>
  // ─── CONFIGURATIE ─────────────────────────────────────────────────────────
  // Voeg hier je events toe of pas ze aan.
  // Elk event heeft een id (uniek, geen spaties), naam en emoji.
  const EVENTS = [
    { id: "kattenbak",  name: "Kattenbak kuisen",  icon: "🐱" },
    // Voeg hier extra events toe:
    // { id: "mijn-event", name: "Naam van event", icon: "✨" },
  ];
  // ─────────────────────────────────────────────────────────────────────────

  const STORAGE_KEY = "tracker_log";

  function loadLog() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveLog(log) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
  }

  function logEvent(id) {
    const log = loadLog();
    log.unshift({ id, ts: Date.now() });
    saveLog(log);
    render();

    const btn = document.querySelector(`[data-id="${id}"] .log-btn`);
    if (btn) {
      btn.textContent = "✓ Geregistreerd!";
      btn.classList.add("just-logged");
      setTimeout(() => {
        btn.textContent = "Registreer";
        btn.classList.remove("just-logged");
      }, 2000);
    }
  }

  function deleteEntry(index) {
    const log = loadLog();
    log.splice(index, 1);
    saveLog(log);
    render();
  }

  function clearHistory() {
    if (confirm("Weet je zeker dat je de volledige geschiedenis wilt wissen?")) {
      saveLog([]);
      render();
    }
  }

  function timeSince(ts) {
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60)    return `${diff} seconden geleden`;
    if (diff < 3600)  return `${Math.floor(diff / 60)} minuten geleden`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} uur geleden`;
    const days = Math.floor(diff / 86400);
    return days === 1 ? "gisteren" : `${days} dagen geleden`;
  }

  function formatDatetime(ts) {
    return new Date(ts).toLocaleString("nl-BE", {
      day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  function render() {
    const log = loadLog();
    const grid = document.getElementById("event-grid");
    const historyEl = document.getElementById("history-list");

    grid.innerHTML = EVENTS.map(ev => {
      const last = log.find(e => e.id === ev.id);
      const meta = last
        ? `<span class="since">${timeSince(last.ts)}</span> &middot; ${formatDatetime(last.ts)}`
        : "Nog niet geregistreerd";
      return `
        <div class="card" data-id="${ev.id}">
          <div class="card-icon">${ev.icon}</div>
          <div class="card-body">
            <div class="card-name">${ev.name}</div>
            <div class="card-meta">${meta}</div>
          </div>
          <button class="log-btn" onclick="logEvent('${ev.id}')">Registreer</button>
        </div>`;
    }).join("");

    if (log.length === 0) {
      historyEl.innerHTML = `<p class="empty-history">Nog geen registraties</p>`;
      return;
    }

    historyEl.innerHTML = log.slice(0, 50).map((entry, i) => {
      const ev = EVENTS.find(e => e.id === entry.id);
      const icon = ev ? ev.icon : "❓";
      const name = ev ? ev.name : entry.id;
      return `
        <div class="history-item">
          <span class="history-icon">${icon}</span>
          <span class="history-name">${name}</span>
          <span class="history-time">${formatDatetime(entry.ts)}</span>
          <button class="history-delete" onclick="deleteEntry(${i})" title="Verwijder">✕</button>
        </div>`;
    }).join("");
  }

  render();
  setInterval(render, 60000);
</script>

</body>
</html>
